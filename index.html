<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ContoSource — Connection to Source</title>
  <meta name="description" content="ContoSource — a minimalist portal to feel connected to Source. Breathe. Return. Remember." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- PRESENCE GATE -->
    <section id="gate" class="screen">
      <div id="orb" aria-hidden="true"></div>
      <div id="whisper" aria-hidden="true">
        <div class="line">Be here.</div>
        <div class="line">You are held.</div>
      </div>
      <button id="enterBtn" class="ghost" aria-label="Enter ContoSource">Enter</button>
    </section>

    <!-- HOME (after gate) -->
    <section id="home" class="screen hidden" aria-hidden="true">
      <header class="home-inner">
        <h1>ContoSource</h1>
        <p class="sub">A minimalist portal to align with Source — breathe, return, remember.</p>

        <div class="actions">
          <a id="startSession" class="btn">Begin Alignment</a>
          <a id="support" class="btn ghost" href="#" target="_blank" rel="noopener">Support (Pay)</a>
        </div>

        <footer class="small">
          <p>Made with intention · © ContoSource</p>
        </footer>
      </header>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
